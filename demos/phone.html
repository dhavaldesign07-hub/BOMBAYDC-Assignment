<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Saarthi – Mobile view</title>
<script>/* on a real phone, open the site itself (no phone inside a phone) */if(matchMedia('(max-width:600px) and (pointer:coarse)').matches)location.replace('website.html')</script>
<style>
@font-face{font-family:Satoshi;src:url(../fonts/Satoshi-Medium.woff2) format('woff2');font-weight:500}
@font-face{font-family:Satoshi;src:url(../fonts/Satoshi-Bold.woff2) format('woff2');font-weight:700}
:root{--navy:#1C4C9A;--deep:#0B1F47;--mute:#5A6478;--bg:#EEF3FB}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:Satoshi,system-ui,sans-serif;background:var(--bg);color:var(--deep);display:flex;flex-direction:column;align-items:center;overflow:hidden}
.top{width:min(1280px,calc(100% - 48px));display:flex;justify-content:space-between;align-items:center;padding:18px 0}
.top b{font-size:15px}.top b span{color:var(--mute);font-weight:500}
.top a{font-size:14px;font-weight:700;color:var(--navy);text-decoration:none}
.top a:hover{text-decoration:underline}
.stage{flex:1;width:100%;display:flex;align-items:flex-start;justify-content:center}
/* simple phone outline, no brand */
.phone{width:414px;height:868px;border-radius:56px;background:var(--deep);padding:12px;box-shadow:0 30px 80px #0B1F4733;transform-origin:50% 0;position:relative}
.phone:before{content:"";position:absolute;top:22px;left:50%;translate:-50% 0;width:96px;height:26px;border-radius:14px;background:var(--deep);z-index:2}
.scr{width:390px;height:844px;border-radius:44px;overflow:hidden;background:#FEFDFC;display:flex;flex-direction:column}.scr .sb{flex:none;height:50px}.scr iframe{display:block;width:390px;flex:1;border:0;background:#fff}
</style></head><body>
<div class="top"><b>Saarthi <span>· mobile view</span></b><a href="website.html">Open desktop version →</a></div>
<div class="stage"><div class="phone" id="ph"><div class="scr"><div class="sb"></div><iframe src="website.html" title="Saarthi website on a phone"></iframe></div></div></div>
<script>
/* shrink the phone to fit the screen height */
const ph=document.getElementById('ph');
function fit(){const room=innerHeight-ph.getBoundingClientRect().top-24,s=Math.min(1,room/868);ph.style.transform=`scale(${s})`;ph.style.marginBottom=`${(s-1)*868}px`}
addEventListener('resize',fit);fit();
</script>
</body></html>
